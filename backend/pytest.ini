[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short -q
markers =
    unit: Birim testleri (CRUD, schema, token)
    integration: Entegrasyon testleri (router + DB)
    e2e: Uçtan uca senaryolar
    stress: Stress ve hata yakalama testleri
    performance: Performans testleri
    api: API sözleşme testleri
