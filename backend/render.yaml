services:
  - type: web
    name: asemos-backend
    runtime: python
    plan: free
    # Migrations via build.sh: python migrate.py only (never Alembic)
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: asemos-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LLM_ENABLED
        value: True
      - key: LLM_PROVIDER
        value: groq
      - key: RECOMMEND_CACHE_TTL
        value: 1800
      # Aşağıdaki değerler Render dashboard'dan manuel girilmeli
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: asemos-db
    databaseName: asemos
    plan: free
    # Migrations via build.sh: python migrate.py only (never Alembic)
    region: frankfurt
