version: '3.8'

# =============================================================
# AsEmOs Platform - Tam Stack Docker Compose
# =============================================================
# Servisler:
#   postgres   → Ana veritabanı        (port 5432)
#   qdrant     → Vektör veritabanı     (port 6333)
#   redis      → AI cache              (port 6379)
#   backend    → Ana API               (port 8000)
#   ai-llm     → AI/Arama servisi     (port 8080)
#
# LLM Katmanları (Ollama YOK — gereksiz):
#   Katman 1: Groq Cloud (hızlı, ücretsiz kota)
#   Katman 2: Scoring fallback (LLM olmadan sıralama)
# =============================================================
#
# Başlatmak için:
#   docker compose up -d
#
# Sadece altyapı:
#   docker compose up -d postgres qdrant redis
#
# Logları izle:
#   docker compose logs -f backend ai-llm
# =============================================================

services:

  # -----------------------------------------------------------
  # 1. PostgreSQL — Ana Veritabanı
  # -----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: asemos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_mekan_oneri_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # 2. Qdrant — Vektör Veritabanı (AI arama için)
  # -----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: asemos_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------
  # 3. Redis — AI Servis Cache
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asemos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # 4. Backend — Ana FastAPI (Auth + CRUD + PostgreSQL)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asemos_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:123@postgres:5432/ai_mekan_oneri_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
      ALLOWED_ORIGINS: "*"
      LLM_ENABLED: "true"
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      RECOMMEND_CACHE_TTL: "1800"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  # -----------------------------------------------------------
  # 5. AI-LLM — AI/Arama Servisi (SerpAPI + Qdrant + Groq)
  # -----------------------------------------------------------
  ai-llm:
    build:
      context: ./ai-llm
      dockerfile: Dockerfile
    container_name: asemos_ai_llm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: mekan_embeddings
      REDIS_URL: redis://redis:6379/0
      REDIS_TTL_SECONDS: "3600"
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DEVICE: cpu
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      BACKEND_API_URL: http://backend:8000
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

# -----------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------
volumes:
  postgres_data:
  qdrant_data:
  redis_data:

