services:
  db:
    image: postgres:15 # İhtiyacınız olan versiyonu seçebilirsiniz
    container_name: ai_mekan_oneri_docker
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: ai_mekan_oneri_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Yedek dosyasını otomatik yüklemek için:
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql

volumes:
  postgres_data:
