services:
  db:
    image: postgres:15 # İhtiyacınız olan versiyonu seçebilirsiniz
    container_name: ai_mekan_oneri_docker
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: ai_mekan_oneri_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
