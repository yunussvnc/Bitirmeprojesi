# =============================================================================
# ssl.conf — her HTTPS server{} bloğuna `include` edilen ortak TLS ayarları.
# =============================================================================
# Tek wildcard sertifika (asemos.tr + *.asemos.tr) certbot_data volume'ünde,
# certbot'un DNS-01 ile aldığı sertifika — 5 domain de AYNI dosya yolunu kullanır.
ssl_certificate         /etc/letsencrypt/live/asemos.tr/fullchain.pem;
ssl_certificate_key     /etc/letsencrypt/live/asemos.tr/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/asemos.tr/chain.pem;

# TLS 1.2 fallback BİLİNÇLİ OLARAK bırakıldı: saf TLS1.3-only (Mozilla "Modern"
# profili) eski Android WebView / kurumsal proxy'lerde bağlantıyı tamamen
# keser. TLS1.2 burada sadece güçlü AEAD cipher'larla (aşağıda) izinli —
# sadece TLS1.3 isteniyorsa bu satırı "ssl_protocols TLSv1.3;" yapıp
# ssl_ciphers satırı TLS1.3'te zaten devre dışı kalır (TLS1.3 cipher seçimi
# ayrı, ssl_conf_command ile yönetilir).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
# TLS1.3'te cipher sırası zaten istemci tarafından belirlenir (RFC önerisi),
# TLS1.2 için de kapatmak modern pratikte önerilen (istemcinin donanım
# hızlandırmasına göre en iyi cipher'ı seçmesine izin verir).
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:secp384r1;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
# Session ticket kapalı: forward secrecy garantisi (ticket key sızarsa geçmiş
# session'lar deşifre edilebilir riski ortadan kalkar), TLS1.3 zaten kendi
# 0-RTT/PSK resumption mekanizmasını kullanıyor.
ssl_session_tickets off;

# OCSP Stapling — istemcinin ayrıca CA'ya "bu sertifika iptal mi" diye
# sormasına gerek kalmaz, nginx bu cevabı sertifikayla birlikte sunar.
ssl_stapling on;
ssl_stapling_verify on;
# Cloudflare'in kendi resolver'ı — OCSP responder adreslerini çözmek için.
resolver 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;
