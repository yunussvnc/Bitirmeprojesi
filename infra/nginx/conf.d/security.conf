# =============================================================================
# security.conf — her HTTPS server{} bloğuna `include` edilen ortak header seti.
# =============================================================================

# HSTS: 2 yıl + tüm subdomain'ler + preload. Wildcard sertifikamız zaten tüm
# subdomain'leri kapsadığı için includeSubDomains güvenle açılabiliyor —
# preload listesine gönderilecekse bu header şart (tek yönlü karar, HSTS
# preload'dan geri dönmek zordur, bilerek ekliyoruz).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# X-XSS-Protection kasıtlı olarak "0": modern tarayıcılarda bu header'ın kendisi
# bazı XSS filtre bypass saldırılarına zemin hazırlayabiliyor (bilinen CVE sınıfı),
# koruma artık CSP'ye devredildi — eski tarayıcılar için de "0" en güvenli değer.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP BİLİNÇLİ OLARAK GEVŞEK: frontend Three.js/WebGL + MapLibre GL JS
# (blob: worker'lar — worker-src/child-src açıkça belirtilmezse script-src'ye
# düşer ve blob: şemasını içermediği için Worker(URL.createObjectURL(blob))
# sessizce engellenir, harita/parçacık arka planı boş kalır), admin Google
# Maps/Cloudinary görselleri, inline stil (Tailwind/Next.js runtime) kullanıyor.
# Sıkı bir CSP tahminle yazılırsa uygulamayı sessizce kırabilir (script/style
# engellenir, hata sadece browser console'da görünür). Bu yüzden burada sadece
# iskelet var — gerçek prod CSP, tarayıcı console'unda ihlalleri gözlemleyerek
# per-domain sıkılaştırılmalı (ayrı bir doğrulama işi).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self';" always;

# Gizli dosyalara erişim engeli (.git, .env vb. yanlışlıkla static root'a
# sızarsa bile dışarıdan görünmesin) — .well-known hariç (ACME/diğer ihtiyaçlar için).
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}
