# =============================================================================
# security.conf — her HTTPS server{} bloğuna `include` edilen ortak header seti
# + gizli dosya erişim engeli. Domain bazlı CSP ayrıca csp-landing.conf veya
# csp-default.conf ile eklenir. Cache-Control kullanan location bloklarında
# ortak header ve CSP include'ları miras kuralı nedeniyle tekrarlanır.
# =============================================================================

include /etc/nginx/conf.d/security-headers.conf;

# Gizli dosyalara erişim engeli (.git, .env vb. yanlışlıkla static root'a
# sızarsa bile dışarıdan görünmesin) — .well-known hariç (ACME/diğer ihtiyaçlar için).
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}
