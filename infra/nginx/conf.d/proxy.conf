# =============================================================================
# proxy.conf — backend/ai-llm/admin'e proxy_pass yapan her location{} bloğuna
# `include` edilen ortak reverse-proxy ayarları.
# =============================================================================
proxy_http_version 1.1;

# Upstream'e giden header'lar — Docker DNS ile konuşulduğu için Host header'ı
# gerçek public domain'i taşımalı ki backend CORS/ALLOWED_ORIGINS kontrolü ve
# ai-llm CORS_ORIGINS doğru çalışsın.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket desteği — backend/app/websocket/manager.py (DM/global/community
# bağlantıları) bu iki header olmadan Upgrade isteğini tamamlayamaz.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeout'lar: connect kısa (upstream ölüyse hızlı fail), read/send orta —
# WebSocket bağlantıları uzun süre açık kalabileceği için read_timeout'un
# heartbeat aralığından (backend 30s) büyük olması gerekiyor.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Buffering: upstream'in yanıtını nginx'in belleğe alıp istemciye kendi
# hızında vermesi — yavaş istemcilerin backend worker'ını meşgul etmesini önler.
proxy_buffering        on;
proxy_buffer_size      8k;
proxy_buffers          8 8k;
proxy_busy_buffers_size 16k;

# Upstream hata verirse (502/503/504/timeout) sınırlı sayıda tekrar dene —
# tekrar sınırsız olursa yavaş bir hata zinciri tüm worker'ları kilitleyebilir.
proxy_next_upstream        error timeout http_502 http_503 http_504;
proxy_next_upstream_tries  2;
