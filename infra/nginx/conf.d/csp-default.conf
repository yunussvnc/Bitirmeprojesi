# Next.js admin hydration ve FastAPI Swagger UI ile geriye uyumlu CSP.
# Landing sayfasının sıkı script politikası csp-landing.conf içinde ayrıdır.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
