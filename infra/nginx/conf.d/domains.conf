# =============================================================================
# domains.conf — 5 domain için server{} blokları.
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP (80) → HTTPS (443) yönlendirme, tüm domainler için tek blok.
# ACME challenge exception'a gerek YOK: SSL stratejimiz DNS-01 (Cloudflare),
# HTTP-01 webroot kullanılmıyor — port 80'in tek işi HTTPS'e yönlendirmek.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name asemos.com www.asemos.com api.asemos.com ai.asemos.com admin.asemos.com;

    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# www.asemos.com → asemos.com (kalıcı yönlendirme, HTTPS üzerinden)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.asemos.com;

    include /etc/nginx/conf.d/ssl.conf;

    return 301 https://asemos.com$request_uri;
}

# -----------------------------------------------------------------------------
# asemos.com — frontend statik dosyalar (Vite build, nginx image'ine
# infra/nginx/Dockerfile içinde frontend build stage'inden COPY edilecek).
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name asemos.com;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security.conf;

    limit_req zone=general_limit burst=40 nodelay;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback: bilinmeyen path'ler index.html'e düşer (React Router
    # tarafında client-side çözülür), 404 yerine.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li dosya adları (Vite'ın ürettiği chunk'lar) içerik değişince adı
    # değişir — bu yüzden 1 yıl immutable cache güvenli, index.html hariç.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# -----------------------------------------------------------------------------
# api.asemos.com → backend (FastAPI, port 8000)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.asemos.com;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security.conf;

    limit_req zone=api_limit burst=50 nodelay;
    client_max_body_size 50m;

    location / {
        proxy_pass http://backend_upstream;
        include /etc/nginx/conf.d/proxy.conf;
    }
}

# -----------------------------------------------------------------------------
# ai.asemos.com → ai-llm (FastAPI, port 8080)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ai.asemos.com;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security.conf;

    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass http://ai_upstream;
        include /etc/nginx/conf.d/proxy.conf;

        # proxy.conf'taki genel 60s yerine daha geniş timeout: iteratif
        # retrieval + LLM rerank zinciri CLAUDE.md'de ~1.25sn ortalama ama
        # worst-case (Groq gecikmesi + retry) daha uzun sürebilir.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# -----------------------------------------------------------------------------
# admin.asemos.com → admin (Next.js standalone, port 3000)
#
# NOT: Önceki SSL mimari incelemesinde flag ettiğim gibi, admin paneli
# hassas bir yüzey — burada sadece reverse proxy var, IP allowlist/basic-auth
# eklenmedi (gerçek admin kullanıcı IP'leri bilinmeden tahmini bir liste
# yazmak ya kimseyi içeri almaz ya da hiç koruma sağlamaz). Karar bekliyor:
# aşağıdaki `allow/deny` iskeleti hazır, IP listesi netleşince açılabilir.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.asemos.com;

    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security.conf;

    limit_req zone=general_limit burst=30 nodelay;

    # IP allowlist iskeleti (opsiyonel, şu an devre dışı):
    # allow 203.0.113.10;
    # deny  all;

    location / {
        proxy_pass http://admin_upstream;
        include /etc/nginx/conf.d/proxy.conf;
    }
}
