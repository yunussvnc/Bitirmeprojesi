# =============================================================================
# security-headers.conf — tüm domainlerde ortak add_header direktifleri.
#
# Nginx'te bir location{} kendi add_header'ını tanımlarsa server{} seviyesindeki
# add_header'lar miras alınmaz. Bu nedenle Cache-Control ekleyen statik frontend
# location'ları bu dosyayı ve kendi domain CSP dosyasını ayrıca include eder.
# =============================================================================

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Modern tarayıcılarda güvenlik CSP'ye devredildi; eski XSS filtresi kapalıdır.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
