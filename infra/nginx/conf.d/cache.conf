# =============================================================================
# cache.conf — statik dosya ve dosya-sistemi metadata cache ayarları.
# =============================================================================
# Dosya descriptor/metadata cache — her istekte diskte stat() çağrısı yapmak
# yerine sık kullanılan dosyaların bilgisini bellekte tutar (frontend statik
# build'i ve admin'in _next/static chunk'ları için performans kazancı).
open_file_cache          max=2000 inactive=30s;
open_file_cache_valid    60s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# =============================================================================
# BİLİNÇLİ TASARIM KARARI: proxy_cache (backend/ai-llm yanıtlarını cache'leme)
# BURADA TANIMLANMADI.
#
# Gerekçe: backend/ai-llm yanıtları kişiselleştirilmiş (RRF + personalization,
# place_interactions tabanlı reranking — CLAUDE.md). Nginx seviyesinde yanlışlıkla
# bu yanıtlar cache'lenirse bir kullanıcı başka bir kullanıcının önerisini/
# verisini görebilir — ciddi bir veri sızıntısı riski. Statik varlık cache'i
# (frontend/admin JS/CSS/görsel) yeterli ve risksiz; dinamik API cache'i
# ihtiyaç olursa SADECE gerçekten kişiselleştirilmemiş, public bir endpoint
# için (örn. genel mekan listesi) ayrı ve açıkça scope'lanmış bir location
# bloğunda eklenmelidir — burada varsayılan olarak kapalı bırakıldı.
# =============================================================================
