# asemos.tr statik Vite frontend CSP.
# Script inline çalıştırma ve HTML event handler'ları yasaktır.
# MapLibre/React runtime style attribute'ları nedeniyle style-src unsafe-inline korunur.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https:; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
