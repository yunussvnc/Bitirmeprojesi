# asemos.tr statik Vite frontend CSP.
# Script inline çalıştırma ve HTML event handler'ları yasaktır.
# MapLibre/React runtime style attribute'ları nedeniyle style-src unsafe-inline korunur.
# script-src 'unsafe-eval': MapLibre GL JS WebGL/worker init'inde string-eval kullanıyor
# (WASM olmadan da), CSP-worker varyantı olmayan bu sürümde bu izin şart — yoksa harita
# hiç render olmuyor (konsolda "unsafe-eval is not an allowed source" ile bloklanıyordu).
# font-src: MapLibre stil dosyasının (CARTO) glyph/font kaynaklarını yüklemesi için;
# default-src 'self' fallback'i bunu engelliyordu.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https:; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
