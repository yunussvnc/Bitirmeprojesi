# =============================================================================
# AsEmOs — nginx ana konfigürasyonu
# =============================================================================
# Bu dosya /etc/nginx/nginx.conf olarak mount/COPY edilecek (infra/nginx/Dockerfile
# sıradaki adımda bunu image'e gömecek). server_block'lar burada YOK — hepsi
# conf.d/domains.conf'ta, bu dosya sadece global http/event ayarlarını taşır.
#
# Brotli modülleri (ngx_brotli) resmi nginx image'inde YOK — infra/nginx/Dockerfile
# bu modülü derleyip modules/ altına koymalı. Modül yoksa aşağıdaki load_module
# satırları nginx'i başlatmaz; bu bilinçli bir bağımlılık, Dockerfile adımında ele
# alınacak. Modül gelene kadar bu iki satırı yorumlayıp brotli'yi gzip'e bırakabilirsiniz.
# =============================================================================

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # upstream response süresi log'a yazılıyor — yavaş backend/ai-llm çağrılarını
    # log'dan teşhis edebilmek için (özellikle ai-llm rerank zinciri).
    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'rt=$request_time uct="$upstream_connect_time" '
        'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65s;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Nginx sürümünü response header'larından gizler — bilgi sızıntısını azaltır.
    server_tokens off;

    # Cloudinary yapılandırılmadığında backend/upload.py video yüklemesi
    # yapabiliyor — 50m makul bir üst sınır, çok büyükse Cloudinary zaten devrede.
    client_max_body_size 50m;
    client_body_buffer_size 128k;

    # ---------------------------------------------------------------------
    # Gzip — brotli'yi desteklemeyen eski istemciler için fallback.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript
        application/xml+rss application/atom+xml
        image/svg+xml font/woff2;

    # ---------------------------------------------------------------------
    # Brotli — gzip'ten ~15-20% daha iyi sıkıştırma, modern tarayıcılarda
    # otomatik tercih edilir (Accept-Encoding: br).
    # ---------------------------------------------------------------------
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css text/xml
        application/json application/javascript
        application/xml+rss application/atom+xml
        image/svg+xml font/woff2;

    # ---------------------------------------------------------------------
    # Real IP — Cloudflare arkasında olduğumuz için $remote_addr varsayılan
    # olarak Cloudflare'in edge IP'sini gösterir, gerçek istemci IP'sini değil.
    # CF-Connecting-IP header'ı gerçek IP'yi taşır; ama bu header'a SADECE
    # Cloudflare'in bilinen IP bloklarından gelen bağlantılarda güvenilir
    # (aksi halde herkes bu header'ı sahteleyip IP spoofing yapabilir).
    # Liste https://www.cloudflare.com/ips/ adresinden periyodik doğrulanmalı.
    # ---------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ---------------------------------------------------------------------
    # Rate limiting — zone tanımları burada, uygulanışı domains.conf'ta
    # (limit_req zone=...). api_limit daha sıkı çünkü backend/ai-llm CPU/DB
    # maliyeti yüksek istekler; general_limit statik/admin için daha gevşek.
    # ---------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # ---------------------------------------------------------------------
    # Upstream'ler — Docker DNS servis adları. keepalive: her istekte yeni
    # TCP bağlantısı açmak yerine upstream'e bağlantı havuzu tutar.
    # ---------------------------------------------------------------------
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream ai_upstream {
        server ai-llm:8080;
        keepalive 16;
    }

    upstream admin_upstream {
        server admin:3000;
        keepalive 16;
    }

    # WebSocket upgrade — istek Upgrade header'ı taşıyorsa Connection:upgrade,
    # taşımıyorsa Connection:close. proxy.conf içinde kullanılıyor.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/cache.conf;
    include /etc/nginx/conf.d/domains.conf;
}
