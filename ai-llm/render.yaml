services:
  - type: web
    name: asemos-ai
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # GROQ API (LLM responses)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      # SerpAPI (Google Maps data)
      - key: SERPAPI_KEY
        sync: false
      # Google Maps API (optional)
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # LLM Provider
      - key: LLM_PROVIDER
        value: layered
      - key: HUGGINGFACE_MODEL
        value: google/gemma-2-2b-it
      - key: USE_4BIT_QUANTIZATION
        value: true
      # Embedding Model
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: EMBEDDING_DEVICE
        value: cpu
      # RAG Settings
      - key: TOP_K_RESULTS
        value: 5
      - key: SIMILARITY_THRESHOLD
        value: 0.4
      # CORS
      - key: CORS_ORIGINS
        value: "*"
      # Database (shared with backend)
      - key: DATABASE_URL
        sync: false
      # Optional Services (can be empty for basic functionality)
      - key: QDRANT_URL
        value: ""
      - key: QDRANT_COLLECTION_NAME
        value: mekan_embeddings
      - key: REDIS_URL
        value: ""
      - key: REDIS_TTL_SECONDS
        value: 3600
      # Backend API URL (for inter-service communication)
      - key: BACKEND_API_URL
        sync: false
